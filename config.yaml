# Single source of truth for every knob the ablation grid sweeps.
# Anything you might want to vary on Day 4 lives here, not in the code.

corpus:
  seed_file: papers.txt
  # arXiv API search_query used to top the corpus up to target_count.
  keyword_query: 'cat:cs.CV AND (abs:"vision language model" OR abs:"multimodal large language model" OR abs:"visual token" OR abs:"efficient inference")'
  target_count: 50
  pdf_dir: data/pdfs
  manifest_path: data/papers.jsonl
  chunk_dir: data/chunks
  # Text from this heading onward is dropped (references pollute retrieval).
  stop_sections: [references, bibliography, acknowledgment, acknowledgments, acknowledgement, acknowledgements]

chunking:
  chunk_size: 512          # tokens; Day 4 sweeps 256 / 512 / 1024
  overlap_ratio: 0.15
  min_chunk_tokens: 40     # shorter tails get merged back into the previous chunk
  tokenizer: BAAI/bge-small-en-v1.5

embedding:
  model: BAAI/bge-small-en-v1.5
  batch_size: 64
  # bge-*-en-v1.5 wants this on the QUERY only, never on the passage.
  query_prefix: "Represent this sentence for searching relevant passages: "
  device: mps              # mps on your M1; cpu if that misbehaves

index:
  dir: data/index          # per chunk size: data/index/512/...

retrieval:
  method: hybrid           # dense | bm25 | hybrid
  top_k: 5                 # final results returned
  candidate_k: 20          # per-retriever depth, and the reranker's input size
  rrf_k: 60
  rerank: true
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2

eval:
  gold_path: eval/gold_set.jsonl
  results_path: eval/results.md
  # Day 3 target mix. build_gold.py --validate checks against this.
  target_mix:
    single_fact: 20
    multi_hop: 10
    comparative: 8
    paraphrased: 7
    unanswerable: 5
